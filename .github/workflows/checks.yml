name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests-and-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Check release version
        run: python scripts/set_version.py --check
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Check Python
        run: |
          python -m ruff check backend/app desktop scripts tests
          python -m ruff format --check backend/app desktop scripts tests
      - name: Check JavaScript
        run: |
          python scripts/format_javascript.py --check
          node --check backend/app/static/app.js
          node --check backend/app/static/i18n.js
          node --check backend/app/static/theme.js
          node --check scripts/verify_ui.cjs
          node --check desktop/electron/main.cjs

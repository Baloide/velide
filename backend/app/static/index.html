<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Velide · by Baloide</title>
<script src="/static/theme.js"></script>
<link rel="icon" href="/static/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><link rel="stylesheet" href="/static/styles.css">
<script src="/static/i18n.js" defer></script><script src="/static/app.js" defer></script>
</head>
<body>
<header class="topbar"><a class="brand" href="/" aria-label="Velide by Baloide"><img src="/static/velide-logo.png" width="40" height="40" alt=""><span><strong>Velide</strong><small>BY BALOIDE</small></span></a><div class="header-actions"><span class="local-badge"><i></i><span data-i18n="local"></span></span><label class="appearance-label"><span class="sr-only" data-i18n="appearance"></span><select id="appearance"><option value="system" data-i18n="system"></option><option value="light" data-i18n="light"></option><option value="dark" data-i18n="dark"></option></select></label><label class="language-label"><span class="sr-only" data-i18n="language"></span><select id="language"><option value="it">Italiano</option><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="pt">Português</option><option value="nl">Nederlands</option><option value="pl">Polski</option><option value="tr">Türkçe</option><option value="ru">Русский</option></select></label></div></header>
<main>
<section class="intro"><div><div class="eyebrow" data-i18n="workspace"></div><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></div><a id="windowsDownload" class="button secondary" href="/download/windows" hidden><span aria-hidden="true">↓</span><span data-i18n="windows"></span></a></section>
<div class="workspace">
<aside class="settings"><div class="section-heading"><span class="step">01</span><h2 data-i18n="settings"></h2></div><label class="field-label" for="maskMode" data-i18n="mode"></label><select id="maskMode"><option value="TAG" data-i18n="tag"></option><option value="PSEUDONYM" data-i18n="pseudonym"></option><option value="BLOCK" data-i18n="block"></option><option value="ASTERISK" data-i18n="asterisk"></option></select><p class="hint" data-i18n="modeHint"></p>
<div class="divider"></div><h3 data-i18n="detect"></h3><div class="filters"><label><input id="chkNames" type="checkbox" checked><span data-i18n="names"></span></label><label><input id="chkTaxCodes" type="checkbox" checked><span data-i18n="tax"></span></label><label><input id="chkDates" type="checkbox" checked><span data-i18n="dates"></span></label><label><input id="chkContacts" type="checkbox" checked><span data-i18n="contacts"></span></label><label><input id="chkLocations" type="checkbox" checked><span data-i18n="locations"></span></label><label><input id="chkIds" type="checkbox" checked><span data-i18n="ids"></span></label></div>
<div class="divider"></div><label class="field-label" for="customKeywords" data-i18n="custom"></label><textarea id="customKeywords" rows="3" data-i18n-placeholder="customPlaceholder"></textarea><p class="hint" data-i18n="customHint"></p><div class="privacy-card"><span aria-hidden="true">◇</span><strong data-i18n="privacyTitle"></strong><p data-i18n="privacyText"></p></div></aside>
<section class="editor-area"><div class="editor-toolbar"><div class="section-heading"><span class="step">02</span><h2 data-i18n="document"></h2></div><div class="toolbar-actions"><button id="btnLoadSample" class="button quiet" data-i18n="sample"></button><button id="btnClear" class="button quiet" data-i18n="clear"></button></div></div><div class="editors"><div class="editor-panel" id="inputPanel"><div class="panel-heading"><label for="rawInput" data-i18n="original"></label><span class="panel-tag" data-i18n="source"></span></div><div id="fileDropZone" class="upload-zone"><span class="upload-symbol" aria-hidden="true">↑</span><div class="upload-copy"><strong data-i18n="dropFile"></strong><p data-i18n="uploadHint"></p></div><button id="btnChooseFile" class="button secondary" data-i18n="chooseFile"></button><input id="fileInput" type="file" accept=".pdf,.docx,.txt,.md" hidden></div><p id="importStatus" class="import-status" role="status" aria-live="polite" hidden></p><div id="importNotice" class="import-notice" role="status" hidden></div><textarea id="rawInput" spellcheck="false" maxlength="200000" data-i18n-placeholder="inputPlaceholder"></textarea><div class="panel-footer"><span id="charCountInput"></span><span data-i18n="auto"></span></div></div><div class="editor-panel result"><div class="panel-heading"><label for="redactedOutput" data-i18n="result"></label><span id="resultBadge" class="panel-tag" data-i18n="review"></span></div><textarea id="redactedOutput" readonly spellcheck="false" data-i18n-placeholder="outputPlaceholder"></textarea><div class="panel-footer"><span id="statEntities"></span><span id="statTime">—</span></div></div></div><div class="export-bar"><p id="processStatus" role="status" aria-live="polite"></p><div class="export-actions"><button id="btnDownload" class="button secondary" disabled data-i18n="save"></button><button id="btnCopyPrompt" class="button secondary" disabled data-i18n="ai"></button><button id="btnCopy" class="button primary" disabled data-i18n="copy"></button></div></div>
<div class="review-note"><span aria-hidden="true">ⓘ</span><p data-i18n="warning"></p></div><details id="entitiesSection" hidden><summary><span data-i18n="detections"></span><span id="badgeCount"></span></summary><div id="entitiesChips"></div></details></section>
</div><footer class="site-footer"><div class="footer-maker"><span data-i18n="madeBy"></span><span class="organization-brand"><img src="/static/baloide-logo.png" width="32" height="32" alt=""><strong>Baloide</strong></span></div><div class="footer-info"><span data-i18n="footer"></span><span aria-hidden="true"> · </span><span id="appVersion">v1.0.0</span></div><span class="copyright">© 2026 Baloide. <span data-i18n="rightsReserved"></span></span></footer>
</main><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
